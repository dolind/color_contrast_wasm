<!doctype html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="style.css"/>
</head>

<body>
<div id="grid-wrapper">
    <div id="grid-container">
        <canvas class="grid" data-dim="3"></canvas>
        <canvas class="grid" data-dim="5"></canvas>
        <canvas class="grid" data-dim="7"></canvas>
        <canvas class="grid" data-dim="13"></canvas>
    </div>
</div>
<div id="controls">
    <label>
        <input type="checkbox" id="constantCells" checked/>
        constant cell size
    </label>
    <label>Iterations:
        <input id="iters" type="number" value="5000" min="1"/>
    </label>
    <button id="run">Generate best grid</button>
    <span id="status"></span>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
