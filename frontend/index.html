<!doctype html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="style.css"/>
    <title>Color Contrast Algorithms</title>
</head>

<body>
<div id="grid-wrapper">
    <div id="grid-container">
        <canvas class="grid" data-dim="3"></canvas>
        <canvas class="grid" data-dim="5"></canvas>
        <canvas class="grid" data-dim="7"></canvas>
        <canvas class="grid" data-dim="13"></canvas>
    </div>
</div>
<div id="tooltip"></div>


<div id="layout">
    <div id="grid-stats"></div>  <!-- table injected by JS -->

    <div id="controls">
        <label>
            <input type="checkbox" id="constantCells" checked />
            constant cell size
        </label>

        <label>
            MaxTime [s]:
            <input id="iters" type="number" value="30" min="1" />
        </label>
    </div>
</div>

<div id="grid-time"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
