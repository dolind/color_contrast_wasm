<!doctype html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Color Contrast Algorithms</title>
  <script type="module" crossorigin src="/assets/index-0e-KPrX_.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-BU8abxIo.css">
</head>

<body>
<div id="grid-wrapper">
    <div id="grid-container">
        <canvas class="grid" data-dim="3"></canvas>
        <canvas class="grid" data-dim="5"></canvas>
        <canvas class="grid" data-dim="7"></canvas>
        <canvas class="grid" data-dim="13"></canvas>
    </div>
</div>
<div id="tooltip"></div>


<div id="layout">
    <div id="grid-stats"></div>  <!-- table injected by JS -->

    <div id="controls">


        <label>
            MaxTime [s]:
            <input id="iters" type="number" value="30" min="1" />
        </label>
        <fieldset>
            <legend>Grid Type</legend>
            <label>
                <input type="radio" name="gridType" value="0" checked />
                Simple
            </label>
            <label>
                <input type="radio" name="gridType" value="1" />
                Improved
            </label>
        </fieldset>

        <fieldset>
            <legend>Algorithm</legend>
            <label>
                <input type="radio" name="algoType" value="0" checked />
                Brut  Force
            </label>
            <label>
                <input type="radio" name="algoType" value="1" />
                Hill Climbing
            </label>
            <label>
                <input type="radio" name="algoType" value="1" />
                Simulated Annealing
            </label>
        </fieldset>

        <label>
            <input type="checkbox" id="uniformColors" />
            Uniform color distribution
        </label>
        <label>
            <input type="checkbox" id="constantCells" checked />
            constant cell size
        </label>
    </div>
</div>

<div id="grid-time"></div>

</body>
</html>
